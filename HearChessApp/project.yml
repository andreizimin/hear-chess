# XcodeGen project for the hear-chess iPhone app. Generate with: xcodegen generate
name: HearChess
options:
  bundleIdPrefix: dev.hearchess
  deploymentTarget:
    iOS: "17.0"
packages:
  HearChessCore:
    path: ../HearChessCore
targets:
  HearChess:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: HearChessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HEARCHESS_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${HEARCHESS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: hear-chess
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "hear-chess listens to your spoken answers during training."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "hear-chess recognizes your spoken answers on this iPhone; audio never leaves it."
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
